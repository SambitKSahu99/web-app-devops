name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'helm/**'

jobs:
  # Build and test code stage
  build_and_test_go_lang_app:
    name: Build and Test Go Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Setup Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22
      
      - name: Build
        run: go build -o go-web-app

      - name: Test
        run: go test ./...
  
  # Code analysis stage
  code-analysis:
    name: Run Code-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run golangci-lnit
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.56.2

  # Build docker image and push to hub
  push_docker_image:
    name: Build and Push docker image to docker hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and Push action
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/web-app:${{github.run_id}}

  # Update the helm with docker image tag
  update_helm_with_latest_iamge_tag:
    name: Update Helm Chart With Latest Image tag
    runs-on: ubuntu-latest
    needs: [push_docker_image]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TOKEN }} # As we are going to commit to github repo so we need a token

      - name: Update tag in Helm Chart
        run: |
          sed -i 's/tag: .*tag: "${{github.run_id}}"/' helm/web-app-chart/values.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email "sambitksahu.99@gmail.com"
          git config --global user.name "sambit"
          git add helm/web-app-chart/values.yaml
          git commit -m "Updated image tag in helm chart"
          git push
